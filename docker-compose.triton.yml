version: '3.8'

services:
  triton-server:
    image: nvcr.io/nvidia/tritonserver:24.01-tf2-python-py3
    container_name: intervalai-triton-gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['1']
              capabilities: [gpu]
    ports:
      - "8010:8000"  # HTTP (non-conflicting with code-talk's 8001-8003)
      - "8011:8001"  # gRPC
      - "8012:8002"  # Metrics
    volumes:
      - ./triton-models:/models:ro
    command: ["tritonserver", "--model-repository=/models", "--log-verbose=1"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v2/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

networks:
  default:
    name: intervalai-network
